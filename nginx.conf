# O site e estatico e nao tem backend: nao existe /api, nao existe upstream e
# nao existe upload. O que sai daqui e HTML, CSS, JS e imagem.

server {
  listen       8080;
  server_name  _;

  # A versao no cabecalho `Server` so serve a quem procura alvo por versao.
  server_tokens off;

  root  /usr/share/nginx/html;
  index index.html;

  # ATENCAO: `add_header` num location DESCARTA os herdados do server. Todo location
  # que declara o proprio header repete os de seguranca.

  # A politica de conteudo, escrita uma vez e repetida onde for preciso.
  #
  # `connect-src 'self'` porque a pagina nao chama API nenhuma: o contato sai por
  # navegacao para o WhatsApp, que nao passa por aqui. `form-action 'none'`
  # porque nenhum formulario da pagina submete: o de orcamento monta a mensagem e
  # abre o WhatsApp. `style-src` precisa de 'unsafe-inline' porque o Vuetify
  # escreve estilo no proprio elemento.
  set $csp_policy "default-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; frame-src 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests";

  location = /healthz {
    access_log off;
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  # Assets com hash no nome podem ser cacheados de forma agressiva.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    try_files $uri =404;
  }

  # O index nunca pode ser cacheado, senao o deploy novo nao chega ao visitante.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy $csp_policy always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  }

  # Pagina unica: rota desconhecida cai no index.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # O HSTS mora na borda, onde o TLS termina (Caddy, no plano de deploy). Posto
  # aqui, ele viajaria por HTTP interno e o navegador o ignoraria.
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy $csp_policy always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
}
