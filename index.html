<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <title>KRLoc · Locacao de equipamentos para obras civis e industriais</title>
    <meta name="description" content="Equipamentos de elevacao, compactacao, concretagem e energia para obra civil e industrial. Orcamento pelo WhatsApp, entrega no canteiro.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://www.krloc.com.br/">

    <!-- O WhatsApp, o LinkedIn e o Facebook NAO executam JavaScript ao montar a
         previa de um link. Como o site e uma SPA, estas tags precisam estar aqui
         no HTML estatico, senao o link compartilhado chega sem titulo e sem imagem.
         E o WhatsApp e justamente o canal de contato da pagina. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="KRLoc">
    <meta property="og:locale" content="pt_BR">
    <meta property="og:title" content="KRLoc · Locacao de equipamentos para obras">
    <meta property="og:description" content="Elevacao, compactacao, concretagem e energia. Orcamento pelo WhatsApp, entrega no canteiro.">
    <meta property="og:url" content="https://www.krloc.com.br/">
    <meta property="og:image" content="https://www.krloc.com.br/og-cover.svg">
    <meta name="twitter:card" content="summary_large_image">

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "KRLoc Locacao de Equipamentos",
        "description": "Locacao de equipamentos para obras civis e industriais.",
        "url": "https://www.krloc.com.br/",
        "telephone": "+55-11-90000-0000",
        "areaServed": "BR",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Rua Exemplo, 000 - Distrito Industrial",
          "addressLocality": "Sao Paulo",
          "addressRegion": "SP",
          "postalCode": "00000-000",
          "addressCountry": "BR"
        },
        "openingHours": "Mo-Fr 07:00-18:00, Sa 08:00-12:00"
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
